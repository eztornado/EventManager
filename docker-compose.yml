services:
  eventmanager:
    build:
      context: .
      dockerfile: Dockerfile
    image: eventmanager:latest
    restart: unless-stopped
    # Coolify's proxy (Traefik) reaches the container over the internal Docker
    # network, so we do not publish a host port (avoids "port is already
    # allocated" when 8080 is taken on the server). Local testing: run with
    # `docker run -p 8080:8080 ...` (see README) or add an override file.
    expose:
      - "8080"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
      PORT: "8080"
      # Public URLs come from the environment (set APP_URL/FRONTEND_URL in
      # Coolify to https://<your-domain>); these fallbacks only serve local runs.
      APP_URL: ${APP_URL:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      DB_CONNECTION: sqlite
      DB_DATABASE: storage/database.sqlite
      LOG_CHANNEL: stdout
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      JWT_SECRET: ${JWT_SECRET:-eventmanager-compose-development-secret}
      MAIL_DRIVER: log
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-demo}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-eur}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - eventmanager-storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  eventmanager-storage:
