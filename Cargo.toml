[package]
name = "eventmanager"
version = "0.1.0"
edition = "2021"

[dependencies]
larust-core = { version = "0.14.0" }
larust-http = { version = "0.14.0", default-features = false }
larust-support = { version = "0.14.0", default-features = false, features = ["sqlite"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tinyvec = "=1.12.0"

[dev-dependencies]
larust-testing = { version = "0.14.0" }

# Keep app line numbers; omit dependency debug information.
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0

# Retain panic unwinding for HTTP panic handling.
[profile.release]
lto = "thin"
strip = "symbols"
incremental = false
